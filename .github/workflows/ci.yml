name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test, build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  windows:
    # The app runs on Windows 11 (NFR-02): prove the install (incl. better-sqlite3's
    # native binary), the tests and the build work there too.
    name: Test and build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    # ADR 0002: keyboard-only user flows and the CS-2 budget against the built app.
    name: E2E (Linux, Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-linux
          path: e2e/playwright-report
          retention-days: 14

  e2e-edge:
    # The owner's browser (NFR-02): Edge is pre-installed on the Windows runner.
    name: E2E (Windows, Edge)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    env:
      PW_CHANNEL: msedge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-windows
          path: e2e/playwright-report
          retention-days: 14

  pilot-package:
    # #26: the pilot zip for the shop PC (built on Linux: the Windows parts are plain files),
    # then a smoke test of the same package on Linux (CLI + launcher + server, crash → restart).
    name: Pilot package (zip + Linux smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run package:pilot
      - run: npm run pilot:smoke
      - uses: actions/upload-artifact@v4
        with:
          name: color-bms-pilot
          path: dist-pilot/*.zip
          retention-days: 30

  pilot-windows:
    # #26: the real .cmd scripts on Windows: install (Task Scheduler), crash → restart,
    # update, go-live reset, stop.
    name: Pilot install smoke (Windows)
    needs: pilot-package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: color-bms-pilot
          path: pilot-zip
      - shell: pwsh
        run: |
          $zip = (Get-ChildItem pilot-zip/*.zip | Select-Object -First 1).FullName
          npm run pilot:smoke -- "$zip"

  installer-windows:
    # #24: the Inno Setup installer, built and run for real: install → crash → update → go-live →
    # uninstall (data kept) → reinstall. The .exe is uploaded for the shop PC.
    name: Windows installer (build + smoke)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - run: npm run package:installer
      - run: npm run installer:smoke
      - uses: actions/upload-artifact@v4
        with:
          name: color-bms-installer
          path: dist-installer/*.exe
          retention-days: 30
