name: Release

# #24 (ADR 0006): builds the Windows installer on Windows (ADR 0001), runs its smoke test, and
# publishes it. Push a tag vX.Y.Z matching apps/server/package.json, or run it by hand (the
# .exe is then only an artifact). The installer goes to the shop PC on a USB stick.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    name: Build and publish the installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content apps/server/package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match apps/server/package.json version $version."
          }
      - run: npm ci
      - name: Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - run: npm run package:installer
      - run: npm run installer:smoke
      - uses: actions/upload-artifact@v4
        with:
          name: color-bms-release
          path: |
            dist-installer/*.exe
            dist-pilot/*.zip
          retention-days: 90
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem dist-installer/*.exe).FullName (Get-ChildItem dist-pilot/*.zip).FullName --title "Sistema Color ${{ github.ref_name }}" --generate-notes
